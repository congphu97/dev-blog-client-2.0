<ion-header [translucent]="true" class="app-main-header">
  <ion-toolbar class="header-toolbar">
    <!-- Brand Logo & Title with Router Link -->
    <a class="brand-link" routerLink="/blog" title="Dev Blog Home">
      <div class="brand-logo-badge">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-svg">
          <rect width="32" height="32" rx="8" fill="url(#brandGrad)" />
          <path d="M10 11L5 16L10 21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M22 11L27 16L22 21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M18 9L14 23" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0f172a" />
              <stop offset="1" stop-color="#334155" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Dev Blog</span>
        <span class="brand-badge">2.0</span>
      </div>
    </a>

    <!-- Right Actions: Navigation Links & Theme Toggle & Login -->
    <ion-buttons slot="end" class="header-user-actions">
      <!-- Dark / Light Theme Toggle Button -->
      <button 
        type="button" 
        class="theme-toggle-btn" 
        (click)="themeService.toggleTheme()" 
        [title]="themeService.isDark() ? 'Chuyển sang Giao diện Sáng (Light Mode)' : 'Chuyển sang Giao diện Tối (Dark Mode)'"
      >
        @if (themeService.isDark()) {
          <!-- Sun Icon with glowing rays -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="theme-icon sun-icon">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <!-- Moon Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="theme-icon moon-icon">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <a routerLink="/blog" routerLinkActive="active" class="header-nav-link" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">📰</span>
        <span class="nav-text">Bài viết</span>
      </a>

      @if (oauthService.currentUser(); as user) {
        <div class="header-auth-user" [title]="user.email">
          <span class="user-provider-badge" [class.google]="user.provider === 'google'" [class.github]="user.provider === 'github'">
            {{ user.provider === 'google' ? 'G' : 'GH' }}
          </span>
          <span class="header-user-name">{{ user.name }}</span>
          <button type="button" class="header-logout-btn" (click)="oauthService.logout()" title="Đăng xuất OAuth2">
            Đăng xuất
          </button>
        </div>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="header-nav-link login-nav-link">
          <span class="nav-icon">🔐</span>
          <span class="nav-text">Đăng nhập</span>
        </a>
      }

      <ngc-avatar [label]="oauthService.currentUser()?.name || 'Phú Cường'" size="small"></ngc-avatar>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
