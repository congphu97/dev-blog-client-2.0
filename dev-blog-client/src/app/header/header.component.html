<ion-header [translucent]="true" class="app-main-header">
  <ion-toolbar class="header-toolbar">
    <!-- Brand Logo & Title with Router Link -->
    <a class="brand-link" routerLink="/blog" title="Dev Blog Home">
      <div class="brand-logo-badge">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-svg">
          <rect width="32" height="32" rx="8" fill="url(#brandGrad)" />
          <path d="M10 11L5 16L10 21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M22 11L27 16L22 21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M18 9L14 23" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0f172a" />
              <stop offset="1" stop-color="#334155" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Dev Blog</span>
        <span class="brand-badge">2.0</span>
      </div>
    </a>

    <!-- Right Actions: Navigation Links & Login -->
    <ion-buttons slot="end" class="header-user-actions">
      <a routerLink="/blog" routerLinkActive="active" class="header-nav-link" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">📰</span>
        <span class="nav-text">Bài viết</span>
      </a>
      <a routerLink="/login" routerLinkActive="active" class="header-nav-link login-nav-link">
        <span class="nav-icon">🔐</span>
        <span class="nav-text">Đăng nhập</span>
      </a>
      <ngc-avatar label="Phú Cường" size="small"></ngc-avatar>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
