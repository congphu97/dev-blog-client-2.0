<div class="blog-vertical-list">
  @for (post of posts(); track post.id) {
    <ngc-card [borderRadius]="'12px'" [contentPaddingVertical]="'0px'" [contentPaddingHorizontal]="'0px'">
      <div ngcCardContent class="list-item">
        <div class="item-image">
          <img [src]="post.imageUrl" [alt]="post.title" />
        </div>

        <div class="item-content">
          <div class="item-header">
            <div class="header-left">
              <ngc-avatar 
                [label]="'Phú'" 
                [avatar]="{ photo: post.imageUrl, mode: 'photo' }" 
                size="medium"
              ></ngc-avatar>
              <div class="title-group">
                <div class="title-row">
                  <h3 class="item-title">{{ post.title }}</h3>
                  <ngc-tag 
                    [label]="post.favorite ? 'Yêu thích' : 'Bài viết'" 
                    [color]="post.favorite ? '#ef4444' : '#10b981'"
                  ></ngc-tag>
                </div>
              </div>
            </div>

            <button class="favorite-btn" (click)="onToggleFavorite(post.id)">
              @if (post.favorite) {
                <span>❤️</span>
              } @else {
                <span>🤍</span>
              }
            </button>
          </div>

          <p class="item-summary">{{ post.summary }}</p>

          <div class="item-actions">
            <button ngcButton color="#3880ff" textColor="#ffffff" size="small" (click)="onChooseToEdit(post)">
              ✏️ Sửa bài này
            </button>
          </div>
        </div>
      </div>
    </ngc-card>
  }
</div>
