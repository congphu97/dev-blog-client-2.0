<form [formRoot]="blogForm" (submit)="submitForm()">
  <div>
    <label>Title:</label>
    <input type="text" [formField]="blogForm.title">
    @if (blogForm.title().touched() && blogForm.title().invalid()) {
      <div style="color: red; font-size: 0.85rem;">
        @for (err of blogForm.title().errors(); track $index) {
          <p style="margin: 2px 0;">{{ err.message }}</p>
        }
      </div>
    }
  </div>

  <div>
    <label>Summary:</label>
    <input type="text" [formField]="blogForm.summary">
    @if (blogForm.summary().touched() && blogForm.summary().invalid()) {
      <div style="color: red; font-size: 0.85rem;">
        @for (err of blogForm.summary().errors(); track $index) {
          <p style="margin: 2px 0;">{{ err.message }}</p>
        }
      </div>
    }
  </div>

  <div>
    <label>Image URL:</label>
    <input type="text" [formField]="blogForm.imageUrl">
  </div>

  <button type="submit" [disabled]="blogForm().invalid()">Submit</button>
</form>
