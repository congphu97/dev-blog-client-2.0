
<form [formGroup]="blogForm">
  <div>
    <label>Title:</label>
    <input type="text" formControlName="title">
  </div>
  <div>
    <label>Summary:</label>
    <input type="text" formControlName="summary">
  </div>
  <div>
    <label>Image URL:</label>
    <input type="text" formControlName="imageUrl">
  </div>
  <button type="submit" [disabled]="blogForm.invalid" (click)="submitForm()">Submit</button>
</form>
