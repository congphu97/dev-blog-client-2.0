name: 🍏 iOS Build IPA & Deploy to Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Ghi chú phiên bản phát hành (Release Notes)"
        required: false
        default: "Manual trigger iOS build from GitHub Actions"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/ios-firebase.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute-ios:
    name: 📦 Build IPA (Fastlane) & Distribute to Firebase
    runs-on: macos-14

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 3. Thiết lập Ruby cho Fastlane & CocoaPods
        uses: actions/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: 4. Cài đặt Dependencies NPM
        run: npm ci --legacy-peer-deps

      - name: 5. Cài đặt Fastlane & CocoaPods
        run: |
          gem install fastlane -N
          gem install cocoapods -N

      - name: 6. Cài đặt Chứng chỉ Apple (.p12) & Provisioning Profile vào Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          # 1. Tạo các biến đường dẫn tạm
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

          # 2. Giải mã Base64 sang file nhị phân
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # 3. Tạo và mở khóa Keychain tạm thời
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 4. Import chứng chỉ p12 vào Keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 5. Cài đặt Provisioning Profile vào thư mục hệ thống Xcode
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 7. Đóng gói file IPA bằng Fastlane (Ad-Hoc)
        run: |
          npm run fastlane:adhoc

      - name: 8. Lưu trữ Artifact IPA lên GitHub Actions (Tải dự phòng)
        uses: actions/upload-artifact@v4
        with:
          name: dev-blog-client-ios-build-${{ github.run_number }}
          path: release/ios/dev-blog-client-adhoc.ipa
          retention-days: 14

      - name: 9. Phân phối IPA lên Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'dev-team' }}
          file: release/ios/dev-blog-client-adhoc.ipa
          releaseNotes: |
            📱 iOS Build: ${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Notes: ${{ github.event.inputs.release_notes || github.event.head_commit.message }}

      - name: 10. Dọn dẹp Keychain Runner
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
