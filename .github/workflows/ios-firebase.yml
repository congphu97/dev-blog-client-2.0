name: 🍏 Build & Distribute iOS IPA to Firebase (Fastlane)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Ghi chú phiên bản phát hành (Release Notes)'
        required: false
        default: 'Manual trigger iOS build from GitHub Actions'

permissions:
  contents: write

jobs:
  build-and-distribute-ios:
    name: Build IPA & Upload Firebase
    if: contains(github.event.head_commit.message, '--build') || contains(github.event.head_commit.message, '--ios') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14

    defaults:
      run:
        working-directory: ./dev-blog-client

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './dev-blog-client/package-lock.json'

      - name: 3. Thiết lập Ruby cho Fastlane & CocoaPods
        uses: actions/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: 4. Cài đặt Dependencies NPM
        run: npm ci --legacy-peer-deps

      - name: 5. Cài đặt Fastlane & CocoaPods
        run: |
          gem install fastlane -N
          gem install cocoapods -N

      - name: 6. Build mã nguồn Web (Angular www)
        run: npm run build

      - name: 7. Đồng bộ sang iOS Native (Capacitor Sync)
        run: npx cap sync ios

      - name: 8. Cài đặt Chứng chỉ Apple (.p12) & Provisioning Profile vào Keychain
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 9. Đóng gói file IPA bằng Fastlane (Ad-Hoc)
        run: |
          cd ios/App
          fastlane build_adhoc skip_sync:true

      - name: 10. Lưu trữ Artifact IPA lên GitHub Actions (Tải dự phòng)
        uses: actions/upload-artifact@v4
        with:
          name: dev-blog-client-ios-build-${{ github.run_number }}
          path: ./dev-blog-client/release/ios/dev-blog-client-adhoc.ipa
          retention-days: 14

      - name: 11. Phân phối IPA lên Firebase App Distribution
        env:
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS || 'dev-team' }}
        run: |
          TARGET_APP_ID="${FIREBASE_IOS_APP_ID}"

          # Tự động đọc từ GoogleService-Info.plist nếu chưa set secret
          if [ -z "$TARGET_APP_ID" ] && [ -f "ios/App/App/GoogleService-Info.plist" ]; then
            PLIST_APP_ID=$(grep -A1 "<key>GOOGLE_APP_ID</key>" ios/App/App/GoogleService-Info.plist | tail -n1 | sed -e 's/<[^>]*>//g' | xargs)
            if [ -n "$PLIST_APP_ID" ]; then
              echo "📋 Tự động lấy được App ID từ GoogleService-Info.plist: $PLIST_APP_ID"
              TARGET_APP_ID="$PLIST_APP_ID"
            fi
          fi

          if [ -z "$TARGET_APP_ID" ]; then
            TARGET_APP_ID="${FIREBASE_APP_ID}"
          fi

          echo "============================================="
          echo "🚀 BẮT ĐẦU PHÂN PHỐI LÊN FIREBASE"
          echo "Target App ID: $TARGET_APP_ID"
          echo "Tester Groups: $FIREBASE_TESTER_GROUPS"
          echo "============================================="

          if [ -z "$TARGET_APP_ID" ]; then
            echo "❌ LỖI: Không tìm thấy Firebase iOS App ID!"
            exit 1
          fi

          npx -y firebase-tools appdistribution:distribute release/ios/dev-blog-client-adhoc.ipa \
            --app "$TARGET_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --token "$FIREBASE_TOKEN" \
            --release-notes "📱 iOS Build ${{ github.run_number }} (${{ github.sha }})"

      - name: 12. Dọn dẹp Keychain Runner
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
