name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

defaults:
  run:
    working-directory: ./dev-blog-client

jobs:
  validate:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn dev-blog-client
        uses: actions/checkout@v4

      # Thêm bước này để xóa symlink bị gãy trước khi clone:
      - name: Xóa symlink ngc-library cũ
        run: rm -rf ngc-library
        working-directory: ${{ github.workspace }}

      # Clone ngc-library vào thư mục ngc-library
      - name: Checkout ngc-library
        uses: actions/checkout@v4
        with:
          repository: congphu97/ngc-library
          path: ngc-library

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dev-blog-client/package-lock.json

      # Build thư viện ngc-library trước
      - name: Cài đặt và build ngc-library
        run: |
          npm ci --legacy-peer-deps
          npm run build:lib
        working-directory: ./ngc-library

      # Cài đặt và build dev-blog-client
      - name: Cài đặt dependencies dev-blog-client
        run: npm ci

      - name: Kiểm tra Lint
        run: npm run lint
        continue-on-error: true

      - name: Build ứng dụng (www)
        run: npm run build
