name: Deploy Web to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./dev-blog-client

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Xóa symlink cũ
        run: rm -rf ngc-library ngc-library-v22
        working-directory: ${{ github.workspace }}

      - name: Checkout ngc-library-v22
        uses: actions/checkout@v4
        with:
          repository: congphu97/ngc-library-v22
          path: ngc-library-v22

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đặt và build ngc-library-v22
        run: |
          npm ci --legacy-peer-deps
          rm -rf node_modules/angular-core/node_modules
          node scripts/patch-angular-core.js
          npm run build:lib
        working-directory: ./ngc-library-v22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Production
        run: npm run build -- --base-href /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dev-blog-client/www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
